# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@legacy
        with:
          kernel-url: https://github.com/qwp12311/android_kernel_lge_sm8150
          kernel-branch: lineage-20
          config: vendor/alphaplus_lao_com-perf_defconfig
          arch: arm64
          aosp-gcc: false
          aosp-clang: true
          aosp-clang-version: r383902
          ksu: false
          android-version: 13
          disable-lto: true
          anykernel3: true
          extra-make-args: "KCFLAGS=-Wno-error"
